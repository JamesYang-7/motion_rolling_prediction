[project]
name = "motion-rolling-prediction"
version = "0.1.0"
description = "Rolling Prediction Models (RPM) for real-time full-body motion from sparse XR tracking"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "matplotlib==3.10.8",
    "pandas==2.3.3",
    "tqdm==4.67.3",
    "loguru==0.7.3",
    "opencv-python==4.13.0.92",
    "trimesh==4.11.5",
    "pyrender==0.1.45",
    "pyopengl==3.1.0",
    "pyyaml==6.0.3",
    "tensorboard==2.20.0",
    "pillow==12.2.0",
    "imageio==2.37.3",
    "onnx==1.23.1",
    "onnxruntime==1.23.2",
]

[tool.uv]
package = false

# Transitive versions pinned to the versions installed in the Linux .venv this
# environment was mirrored from, so Windows resolves the same tree.
constraint-dependencies = [
    "absl-py==2.4.0",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "filelock==3.28.0",
    "fonttools==4.62.1",
    "freetype-py==2.5.1",
    "fsspec==2026.3.0",
    "grpcio==1.80.0",
    "jinja2==3.1.6",
    "kiwisolver==1.5.0",
    "markdown==3.10.2",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.4.2",
    "packaging==26.1",
    "protobuf==7.34.1",
    "pyglet==2.1.14",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.1.post1",
    "setuptools==82.0.1",
    "six==1.17.0",
    "sympy==1.13.1",
    "tensorboard-data-server==0.7.2",
    "typing-extensions==4.15.0",
    "tzdata==2026.1",
    "werkzeug==3.1.8",
]

# CUDA 12.4 wheels for every platform. PyPI's Windows torch wheels are CPU-only,
# so the explicit PyTorch index is what makes the Windows env match this one.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
